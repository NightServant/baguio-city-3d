services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: baguio_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: baguio
      POSTGRES_PASSWORD: baguio
      POSTGRES_DB: baguio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baguio -d baguio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: baguio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
